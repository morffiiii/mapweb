<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f2" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('terra-theme') === 'light' ? 'light' : 'dark'; }
      catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <meta name="description" content="Terra — карта твоих личных открытий. Гуляй, исследуй, сохраняй воспоминания." />
    <title>Terra — твой мир открывается</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
  </head>
  <body>
    <div id="map" aria-label="Карта открытий"></div>
    <canvas id="fog" aria-hidden="true"></canvas>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
