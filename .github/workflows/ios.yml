name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec cap add ios
      - run: node scripts/prepare-ios.mjs
      - run: pnpm exec cap sync ios
      - name: Build unsigned device app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA for Sideloadly
        run: |
          mkdir -p build/package/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app build/package/Payload/Terra.app
          cd build/package
          zip -r -q ../Terra-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Terra-iPhone
          path: build/Terra-unsigned.ipa
          retention-days: 7
