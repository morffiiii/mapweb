name: Native iOS and Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate native project
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate
      - name: Test native app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl location "$DEVICE" set '55.751244,37.618423'
          (while true; do xcrun simctl location "$DEVICE" set '55.751244,37.618423'; sleep 5; done) &
          GPS_PID=$!
          trap 'kill "$GPS_PID" 2>/dev/null || true' EXIT
          xcodebuild -project mobile/ios/Terra.xcodeproj -scheme Terra -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/iOS-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Build native iPhone app
        run: |
          xcodebuild -project mobile/ios/Terra.xcodeproj -scheme Terra -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Terra.app build/package/Payload/Terra.app
          cd build/package
          zip -r -q ../Terra-native-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Terra-iPhone-native
          path: build/Terra-native-unsigned.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: build/iOS-tests.xcresult
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: terra-android-install-key-v1
      - name: Test and build native APK
        working-directory: mobile/android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Terra-Android-native
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: mobile/android/app/build/reports/tests
          retention-days: 7
